#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Disable the Kotlin/Native static cache for iOS targets. Under the Xcode 26
# toolchain the cache builder crashes on navigation-compose's inline
# getBackStackEntry ("Failed to build cache ... is not found"). The cache is a
# build-time optimization only; disabling it produces identical binaries.
kotlin.native.cacheKind.iosSimulatorArm64=none
kotlin.native.cacheKind.iosArm64=none

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
