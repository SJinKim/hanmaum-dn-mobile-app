# Release Drafter — PRODUCTION track (main)
#
# Every merge to `main` updates a DRAFT release titled "PROD-Release vX.Y.Z".
# Nothing is tagged until you open the draft in the Releases tab and click
# Publish — publishing creates the final `vX.Y.Z` tag (no -st suffix) and
# marks the production release point.
#
# Publishing the prod release does NOT auto-submit to the App Store: shipping
# to the App Store stays the deliberate manual lane in distribute.yml
# (workflow_dispatch → ios-appstore, gated by the `prod` environment), per the
# CLAUDE.md prod-lane invariant. The tag is the release marker; you run the
# App Store lane when you mean to ship.
#
# See RELEASE.md for the full runbook.

name-template: 'PROD-Release v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Draft against main (target branch for the release + which merged PRs count).
# filter-by-commitish was removed — it matched releases by exact
# target_commitish string, which filtered out baseline/seed releases.
commitish: refs/heads/main

# Count the `-st` staging pre-releases when picking the last release.
#
# This used to be left at its default (false) so the prod line would have a
# version base "of its own". That is what it did: with the newest non-pre-release
# being v0.5.0 from July, this config kept resolving to v0.6.0 — a number BELOW
# the v0.7.1-st already in TestFlight — and re-created that draft on every push
# to main. A production release must never be numbered under what has shipped.
#
# Both tracks now share one ascending version line and stay apart by tag shape
# alone (`vX.Y.Z` here, `vX.Y.Z-st` in the staging config). The staging config
# needs no matching key: it is run with `prerelease: true`, and
# `include-pre-releases` has no effect in that case — pre-releases are already
# its version base.
include-pre-releases: true

version-template: '$MAJOR.$MINOR.$PATCH'

categories:
  # `breaking` needs a category of its own: the autolabeler's `feature` pattern
  # requires a `:` straight after the scope, so `feat!:` matches only the
  # breaking rule. Without an entry here the most important kind of change fell
  # into the uncategorised block above the first heading.
  - title: '💥 Breaking Changes'
    labels: ['breaking', 'major']
  - title: '🚀 Features'
    labels: ['feature', 'enhancement', 'minor']
  - title: '🐛 Fixes'
    labels: ['fix', 'bug', 'patch']
  - title: '🧹 Maintenance'
    labels: ['chore', 'documentation', 'refactor', 'dependencies', 'ci']

# Each line credits the PR author by GitHub login (`@$AUTHOR`). Release notes
# only ever list merged PRs, and PRs are authored by human GitHub accounts
# (CLAUDE.md forbids AI authorship; the pipeline's only bot, version-sync, makes
# commits not PRs), so an AI/tool name can never appear here. `exclude-contributors`
# is a belt-and-braces guard: any automation login is stripped from author output.
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
no-changes-template: '- No user-facing changes since the last production release.'
exclude-contributors:
  - 'github-actions'
  - 'github-actions[bot]'
  - 'claude'
  - 'claude[bot]'

# PRE-1.0 "zerover" guard — identical policy to the staging config: breaking
# changes are capped at `minor` so nothing auto-jumps to the reserved 1.0.0.
# After 1.0.0 ships, promote `major`/`breaking` to a real `major:` key here too.
version-resolver:
  minor:
    labels:
      - 'major'
      - 'breaking'
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'perf'
      - 'chore'
      - 'documentation'
      - 'refactor'
      - 'dependencies'
      - 'ci'
  default: patch

autolabeler:
  - label: 'breaking'
    title:
      - '/^\w+(\(.+\))?!:/'
    body:
      - '/BREAKING[ -]CHANGE/'
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?:/i'
  - label: 'fix'
    title:
      - '/^(fix|perf)(\(.+\))?:/i'
  - label: 'chore'
    title:
      - '/^(chore|docs|style|refactor|test|ci|build)(\(.+\))?:/i'

template: |
  ## What's Changed
  $CHANGES

  **Full Changelog**: https://github.com/SJinKim/hanmaum-dn-mobile-app/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
