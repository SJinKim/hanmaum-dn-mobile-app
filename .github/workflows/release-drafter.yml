name: Release Drafter

# Dual-track draft-release automation.
#
#   PR opened / updated  → autolabel the PR from its Conventional-Commit title
#                          (feat→feature, fix→fix, `!`/BREAKING→breaking, …).
#   Merge to main        → update BOTH drafts: the staging "ST-Release
#                          vX.Y.Z-st" and the production "PROD-Release vX.Y.Z".
#
# Both come off `main` now that `develop` is retired. Publishing the ST draft
# marks what staging should contain; the build itself is a manual dispatch.
#
# Drafts accumulate silently — no tag, no build — until a human publishes them
# in the Releases tab. Publishing a draft creates its tag (which is what
# distribute.yml no longer listens on any tag — every build is a manual
# dispatch. See RELEASE.md.

on:
  push:
    branches: [main]
  pull_request:
    # `synchronize` re-labels when the title/commits change after opening.
    types: [opened, reopened, synchronize]
    branches: [main]
  # Manual run: refresh a draft on demand — e.g. to seed the first release, or
  # after a push was skipped.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # autolabeler writes labels onto PRs

jobs:
  # ── STAGING draft ────────────────────────────────────────────────────────
  draft-staging:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/update the draft release
      pull-requests: write   # autolabeler
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter-st.yml
          commitish: refs/heads/main
          prerelease: true
          # On a PR event only autolabel (there is nothing to draft yet); on a
          # On a push to main, build/refresh the staging draft.
          disable-releaser: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── PRODUCTION: main pushes + PRs targeting main ─────────────────────────
  draft-production:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter-prod.yml
          commitish: refs/heads/main
          prerelease: false
          disable-releaser: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
