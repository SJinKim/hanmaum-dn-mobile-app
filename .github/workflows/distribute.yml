name: Distribute

on:
  push:
    branches: [develop, main]
    tags: ['v*']            # push a release tag (e.g. v1.2.0) → TestFlight
  # TestFlight is deployed on demand (see distribute-testflight) so beta builds
  # are intentional release points, not one-per-commit. Trigger it either by
  # pushing a v* tag, or manually from Actions → "Distribute" → "Run workflow"
  # (pick the develop branch).
  workflow_dispatch:

jobs:
  # ── develop → ST ──────────────────────────────────────────────────────────
  distribute-st:
    name: ST → Firebase App Distribution
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Write .env
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          PCLOUD_FOLDER_ENDPOINT: ${{ secrets.PCLOUD_FOLDER_ENDPOINT }}
          PCLOUD_DOWNLOAD_ENDPOINT: ${{ secrets.PCLOUD_DOWNLOAD_ENDPOINT }}
        run: |
          echo "GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}" > .env
          echo "GOOGLE_CALENDAR_API_KEY=${GOOGLE_CALENDAR_API_KEY}" >> .env
          echo "PCLOUD_FOLDER_ENDPOINT=${PCLOUD_FOLDER_ENDPOINT}" >> .env
          echo "PCLOUD_DOWNLOAD_ENDPOINT=${PCLOUD_DOWNLOAD_ENDPOINT}" >> .env

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "${FIREBASE_SERVICE_ACCOUNT}" > firebase-service-account.json

      - name: Build & Distribute (stDebug)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json
          RELEASE_NOTES: "ST · ${{ github.ref_name }} @ ${{ github.sha }}"
        run: |
          chmod +x gradlew
          ./gradlew assembleStDebug appDistributionUploadStDebug --no-daemon

  # ── main → Prod ───────────────────────────────────────────────────────────
  distribute-prod:
    name: Prod → Firebase App Distribution
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Write .env
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          PCLOUD_FOLDER_ENDPOINT: ${{ secrets.PCLOUD_FOLDER_ENDPOINT }}
          PCLOUD_DOWNLOAD_ENDPOINT: ${{ secrets.PCLOUD_DOWNLOAD_ENDPOINT }}
        run: |
          echo "GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}" > .env
          echo "GOOGLE_CALENDAR_API_KEY=${GOOGLE_CALENDAR_API_KEY}" >> .env
          echo "PCLOUD_FOLDER_ENDPOINT=${PCLOUD_FOLDER_ENDPOINT}" >> .env
          echo "PCLOUD_DOWNLOAD_ENDPOINT=${PCLOUD_DOWNLOAD_ENDPOINT}" >> .env

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > release.keystore

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "${FIREBASE_SERVICE_ACCOUNT}" > firebase-service-account.json

      - name: Build & Distribute (prodRelease)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_NOTES: "Prod · ${{ github.ref_name }} @ ${{ github.sha }}"
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease appDistributionUploadProdRelease --no-daemon

  # ── manual → TestFlight (iOS, staging backend) ────────────────────────────
  # Deployed on demand only (workflow_dispatch), so minor commits don't each
  # produce a TestFlight build. Trigger from Actions → "Distribute" → Run workflow.
  distribute-testflight:
    name: iOS → TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    # macos-15+ is required to run Xcode 26 (App Store Connect rejects uploads
    # not built with the iOS 26 SDK).
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history + tags, so git describe can read the latest tag

      # Marketing version (CFBundleShortVersionString) follows the latest release
      # tag; the build number (CFBundleVersion) is the always-incrementing run
      # number. So a tag push ships its own version (v1.2.0 → 1.2.0), and a manual
      # run reuses the latest tag's version while only the build number climbs —
      # e.g. 1.2.0 (12) then 1.2.0 (13). Falls back to 1.0.0 before any tag exists.
      - name: Resolve marketing version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            VERSION="${LATEST_TAG#v}"
          fi
          [ -z "$VERSION" ] && VERSION="1.0.0"
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Shipping marketing version $VERSION, build ${{ github.run_number }}"

      - name: Select latest stable Xcode (iOS 26 SDK required by App Store Connect)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iosApp

      - name: Write .env (buildkonfig fields + iOS staging URLs)
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          PCLOUD_FOLDER_ENDPOINT: ${{ secrets.PCLOUD_FOLDER_ENDPOINT }}
          PCLOUD_DOWNLOAD_ENDPOINT: ${{ secrets.PCLOUD_DOWNLOAD_ENDPOINT }}
        run: |
          echo "GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}" > .env
          echo "GOOGLE_CALENDAR_API_KEY=${GOOGLE_CALENDAR_API_KEY}" >> .env
          echo "PCLOUD_FOLDER_ENDPOINT=${PCLOUD_FOLDER_ENDPOINT}" >> .env
          echo "PCLOUD_DOWNLOAD_ENDPOINT=${PCLOUD_DOWNLOAD_ENDPOINT}" >> .env
          echo "IOS_BACKEND_URL=https://api.staging.graceops.de" >> .env
          echo "IOS_KEYCLOAK_URL=https://auth.graceops.de" >> .env
          echo "IOS_KEYCLOAK_REALM=hanmaum-dn-st" >> .env

      - name: Build & upload to TestFlight
        working-directory: iosApp
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
          # match: encrypted git store for the App Store distribution cert + profile.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          # HTTPS auth for the private certs repo: base64("x-access-token:<PAT>").
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          chmod +x ../gradlew
          bundle exec fastlane beta
