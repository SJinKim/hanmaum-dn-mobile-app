name: PR Check (KMP)

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  android-common-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Check for unreferenced TODOs
        run: |
          # A TODO may stay in the code as long as it names where the work is
          # tracked, e.g. TODO(hanmaum-dn-server#115). Those are deferred on
          # purpose - a missing endpoint, a later milestone - and must not
          # block a merge. A bare TODO belongs to nobody and still fails.
          if grep -rn "TODO" ./composeApp/src | grep -v "TODO("; then
            echo "Unreferenced TODO found. Write TODO(owner/repo#123) and track it in the project, or remove it."
            exit 1
          fi

      - name: Run Lint & Formatting
        run: ./gradlew lint

      - name: Run Common & Android Unit Tests
        run: ./gradlew :composeApp:testDevDebugUnitTest

  ios-check:
    needs: android-common-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run iOS Tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Build iOS Framework
        run: ./gradlew :composeApp:assembleReleaseX64