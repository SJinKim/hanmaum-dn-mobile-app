name: PR Check (KMP)

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  android-common-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Check for TODOs
        run: |
          if grep -r "TODO" ./composeApp/src; then
            echo "Found pending TODOs! Clean them up before merging."
            exit 1
          fi

      - name: Run Lint & Formatting
        run: ./gradlew lint

      - name: Run Common & Android Unit Tests
        run: ./gradlew :composeApp:testDevDebugUnitTest

  ios-check:
    needs: android-common-check
    # macos-15+ to match the TestFlight build's Xcode 26 / iOS 26 SDK.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run iOS Tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Build iOS app (Swift + Kotlin framework)
        # Compiles the Swift iosApp target against the Kotlin framework — catches
        # Swift<->Kotlin interop mismatches (e.g. missing args from dropped Kotlin
        # defaults) that the gradle framework-link tasks above never see. Simulator
        # build with signing disabled, so no certs/secrets and no full archive.
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
