name: Sync versionName on release publish

# When a draft release is published (staging `vX.Y.Z-st` or prod `vX.Y.Z`),
# rewrite Android `versionName` in composeApp/build.gradle.kts to the numeric
# version so the marketing version never drifts from the release line. The
# commit lands on the release's own branch (develop for -st, main for final)
# and carries [skip ci] so it does not re-trigger builds or the drafter.
#
# iOS marketing version is derived from the tag at build time (git describe in
# distribute.yml), so it needs no file edit — this keeps the Android side in step.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync-version-name:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release's branch
        uses: actions/checkout@v4
        with:
          # `-st` tags come from develop; final tags from main. Derived from the
          # tag itself so it never depends on the release's target_commitish format.
          ref: ${{ endsWith(github.event.release.tag_name, '-st') && 'develop' || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute numeric version + target branch from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"   # v1.4.0-st or v1.4.0
          case "$TAG" in
            *-st) BRANCH=develop ;;
            *)    BRANCH=main ;;
          esac
          VERSION="${TAG#v}"                            # 1.4.0-st or 1.4.0
          VERSION="${VERSION%-st}"                      # 1.4.0
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' did not yield an x.y.z version ('$VERSION') — skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          # No-downgrade guard: never let a release lower the branch's versionName.
          # Protects against a baseline/back-dated release (e.g. seeding an older
          # tag) rewriting a branch that is already on a higher version.
          CURRENT="$(grep -m1 -oE 'versionName = "[^"]*"' composeApp/build.gradle.kts | sed -E 's/.*"([^"]*)".*/\1/')"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$VERSION" ]; then
            HIGHER="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)"
            if [ "$HIGHER" != "$VERSION" ]; then
              echo "Refusing to downgrade versionName $CURRENT -> $VERSION on $BRANCH — skipping."
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Rewrite versionName
        if: env.SKIP != '1'
        run: |
          sed -i -E 's/(versionName = ")[^"]*(")/\1'"$VERSION"'\2/' composeApp/build.gradle.kts
          echo "versionName now:"
          grep -n 'versionName = ' composeApp/build.gradle.kts

      - name: Commit back to the release branch
        if: env.SKIP != '1'
        run: |
          if git diff --quiet -- composeApp/build.gradle.kts; then
            echo "versionName already $VERSION — nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composeApp/build.gradle.kts
          git commit -m "chore(release): set versionName to $VERSION [skip ci]"
          git push origin "HEAD:$BRANCH"
